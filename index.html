<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Solver</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- Background decorations -->
    <div class="bg-circle circle-one"></div>
    <div class="bg-circle circle-two"></div>


    <!-- ==============================
         HOME SCREEN
    =============================== -->

    <main id="home-screen" class="screen active">

        <div class="logo">

            <div class="logo-icon">
                🧩
            </div>

            <h1>
                Puzzle<span>Solver</span>
            </h1>

        </div>


        <div class="home-content">

            <div class="puzzle-icon">
                🧠
            </div>

            <p class="eyebrow">
                TRAIN YOUR BRAIN
            </p>

            <h2>
                Challenge Your Mind
            </h2>

            <p class="home-description">
                Solve puzzles, unlock levels and become
                <br>
                the ultimate puzzle master.
            </p>


            <button
                id="play-btn"
                class="primary-btn"
            >
                <span>▶</span>
                Start Game
            </button>


            <button
                id="stats-btn"
                class="secondary-btn home-secondary-btn"
            >
                📊 My Statistics
            </button>


            <div class="home-stats">

                <div>
                    <strong>100</strong>
                    <small>Levels</small>
                </div>

                <div>
                    <strong>∞</strong>
                    <small>Challenges</small>
                </div>

                <div>
                    <strong>🏆</strong>
                    <small>Rewards</small>
                </div>

            </div>

        </div>


        <footer>
            Made with ❤️ for puzzle lovers
        </footer>

    </main>



    <!-- ==============================
         LEVEL SCREEN
    =============================== -->

    <main id="level-screen" class="screen">

        <header class="top-bar">

            <button
                id="back-btn"
                class="icon-btn"
            >
                ←
            </button>


            <div class="top-title">

                <span>🧩</span>

                <strong>
                    Puzzle Solver
                </strong>

            </div>


            <div class="player-score">

                ⭐

                <span id="total-stars">
                    0
                </span>

            </div>

        </header>


        <section class="levels-container">

            <div class="level-heading">

                <p>
                    YOUR PROGRESS
                </p>

                <h2>
                    Select a Level
                </h2>


                <div class="progress-container">

                    <div class="progress-bar">

                        <div
                            id="progress"
                            class="progress"
                        ></div>

                    </div>

                    <span id="progress-text">
                        1 / 20
                    </span>

                </div>

            </div>


            <div
                id="levels-grid"
                class="levels-grid"
            >
                <!-- Levels generated by JavaScript -->
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
